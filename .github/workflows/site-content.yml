name: Propose website content update

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  # Needed only to start the Checks workflow on the proposal branch.
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: site-content
  cancel-in-progress: false

env:
  BRANCH: content/site
  FAILURE_TITLE: Website content update is failing

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      SITE_CONTENT_CSV_URL: ${{ vars.SITE_CONTENT_CSV_URL }}
    steps:
      # No stored token: npm runs third-party code below, so only the steps
      # that call gh or push are given GH_TOKEN.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check configuration
        id: config
        run: |
          if [ -z "$SITE_CONTENT_CSV_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Repository variable SITE_CONTENT_CSV_URL is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read and validate the website sheet
        if: steps.config.outputs.configured == 'true'
        run: |
          set -o pipefail
          python3 pipeline/build_site_content.py --summary "$RUNNER_TEMP/site-content-summary.md" 2>&1 \
            | tee "$RUNNER_TEMP/site-content.log"
          if [ -f "$RUNNER_TEMP/site-content-summary.md" ]; then
            cat "$RUNNER_TEMP/site-content-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Compared against main, and against the proposal already waiting, so a
      # waiting pull request is updated with later edits instead of going stale.
      - name: Detect a content change
        if: steps.config.outputs.configured == 'true'
        id: change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- data/site.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The Sheet matches the site."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ] && git fetch --quiet origin "$BRANCH" \
            && git diff --quiet FETCH_HEAD -- data/site.json; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Pull request #$pr already proposes this content."
          fi

      - name: Close a proposal the Sheet no longer wants
        if: steps.change.outputs.changed == 'false' && steps.change.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close "${{ steps.change.outputs.pr }}" --delete-branch \
            --comment "The Sheet matches the site again, so this proposal is no longer needed."

      - uses: actions/setup-node@v4
        if: steps.change.outputs.changed == 'true' && steps.change.outputs.pending != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Check the site builds with this content
        if: steps.change.outputs.changed == 'true' && steps.change.outputs.pending != 'true'
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:pipeline
          npm run photos:check
          npm run build

      - name: Open or update the review pull request
        if: steps.change.outputs.changed == 'true' && steps.change.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/site.json
          git commit -m "content: update public website copy"
          git push --force origin "$BRANCH"
          pr="${{ steps.change.outputs.pr }}"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/site-content-summary.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Website content update" \
              --body-file "$RUNNER_TEMP/site-content-summary.md"
          fi
          # Pull requests opened with GITHUB_TOKEN start no other workflows, so
          # the required Checks run is started by name on this branch.
          gh workflow run checks.yml --ref "$BRANCH"

      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The last website content run failed, so Sheet edits are not reaching the site."
            echo
            echo '```'
            tail -n 20 "$RUNNER_TEMP/site-content.log" 2>/dev/null || echo "No log; see the run."
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/failure.md"
          issue="$(gh issue list --state open --search "\"$FAILURE_TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/failure.md"
          else
            gh issue create --title "$FAILURE_TITLE" --body-file "$RUNNER_TEMP/failure.md"
          fi

      - name: Close the failure issue once it works again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue="$(gh issue list --state open --search "\"$FAILURE_TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Working again as of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
