name: Propose website content update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-content
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      SITE_CONTENT_CSV_URL: ${{ vars.SITE_CONTENT_CSV_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        run: |
          if [ -z "$SITE_CONTENT_CSV_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Repository variable SITE_CONTENT_CSV_URL is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing content proposal
        if: steps.config.outputs.configured == 'true'
        id: existing
        run: |
          count="$(gh pr list --state open --search 'Website content update in:title' --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "A website content pull request is already waiting for review."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read and validate the website sheet
        if: steps.config.outputs.configured == 'true' && steps.existing.outputs.open == 'false'
        run: |
          python3 pipeline/build_site_content.py --summary "$RUNNER_TEMP/site-content-summary.md"
          if [ -f "$RUNNER_TEMP/site-content-summary.md" ]; then
            cat "$RUNNER_TEMP/site-content-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect a content change
        if: steps.config.outputs.configured == 'true' && steps.existing.outputs.open == 'false'
        id: change
        run: |
          if git diff --quiet -- data/site.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No approved website changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.change.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.change.outputs.changed == 'true'
        run: npm ci

      - if: steps.change.outputs.changed == 'true'
        run: npm run lint

      - if: steps.change.outputs.changed == 'true'
        run: npm test

      - if: steps.change.outputs.changed == 'true'
        run: npm run test:site-content

      - if: steps.change.outputs.changed == 'true'
        run: npm run photos:check

      - if: steps.change.outputs.changed == 'true'
        run: npm run build

      - name: Open a review pull request
        if: steps.change.outputs.changed == 'true'
        env:
          BRANCH_NAME: content/site-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add data/site.json
          git commit -m "content: update public website copy"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Website content update" \
            --body-file "$RUNNER_TEMP/site-content-summary.md"
