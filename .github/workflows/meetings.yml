# Refreshes the "next meeting" line from the club's public calendar.
#
# The site is a static export, so it cannot look up the calendar when somebody
# visits — the answer has to be baked in when the site is built. This runs
# weekly and proposes a data/meetings.json update for review.
#
# 10pm Friday, because the club meets Friday evening and never runs that late:
# by the time this runs, the week's meeting has happened and the next one is
# genuinely next.
#
# Unlike the scores pipeline, this one is safe to run in CI. It reads a public
# calendar and touches no roster, so no real name can reach the build log.

name: Refresh meetings

on:
  schedule:
    # 02:00 UTC Saturday = 10pm Friday in Charlottesville (EDT, UTC-4). GitHub
    # runs cron in UTC and does not follow daylight saving, so this becomes
    # 9pm once EST (UTC-5) starts and drifts back with the spring change.
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  # Needed only to start the Checks workflow on the proposal branch.
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: meetings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Reuse an open proposal or start a new one
        id: proposal
        run: |
          pr="$(gh pr list --state open --json number,headRefName,author,headRepositoryOwner \
            --jq '[.[] | select((.headRefName | startswith("meetings/")) and .author.login == "app/github-actions" and .headRepositoryOwner.login == "mahjongclub-uva")][0].number // empty')"
          if [ -n "$pr" ]; then
            branch="$(gh pr view "$pr" --json headRefName --jq .headRefName)"
            git fetch origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            branch="meetings/$GITHUB_RUN_ID"
            git switch -c "$branch"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - run: python3 pipeline/build_meetings.py

      - name: Open or update the meeting review pull request
        run: |
          if git diff --quiet -- data/meetings.json; then
            echo "Calendar unchanged; nothing to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meetings.json
          git commit -m "chore(data): refresh next meeting from the calendar"
          git push -u origin "${{ steps.proposal.outputs.branch }}"
          if [ -z "${{ steps.proposal.outputs.pr }}" ]; then
            gh pr create --base main --head "${{ steps.proposal.outputs.branch }}" \
              --title "Meeting calendar update" \
              --body "Updates the next meeting from the club's public calendar. Review the date and location before merging."
          fi
          # Pull requests opened with GITHUB_TOKEN start no other workflows, so
          # the required Checks run is started by name on this branch.
          gh workflow run checks.yml --ref "${{ steps.proposal.outputs.branch }}"
