# Builds the site and publishes it to GitHub Pages.
#
# It reads the club's public calendar for the next meeting, which holds no
# private data. It does NOT run the score pipeline. data/*.json is committed by whoever updates
# the scores, and CI only turns that committed data into HTML. That is
# deliberate: the pipeline needs the roster, the roster holds real names, and
# real names must never reach this public repo or its build logs.
#
# So the update loop is:
#   1. secretary updates the Google Sheet
#   2. someone runs `python3 pipeline/build_data.py` locally
#   3. they commit the changed data/*.json and push
#   4. this workflow rebuilds and deploys

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily at 10:00 UTC (6am Eastern in summer), so a calendar change reaches
  # the homepage within a day without anyone committing it.
  schedule:
    - cron: "0 10 * * *"
  # Lets you redeploy from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run photos:check

      # A failed read keeps the committed data/meetings.json, so a Google
      # outage never blocks a deploy.
      - name: Read upcoming meetings from the calendar
        run: python3 pipeline/build_meetings.py || echo "::warning::Could not read the calendar; keeping the committed meetings."

      # Fails if data/*.json breaks the output contract, which stops the deploy
      # and leaves the last good version of the site up.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
