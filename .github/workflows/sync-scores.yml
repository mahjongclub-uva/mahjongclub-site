name: Propose score update

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: score-update
  cancel-in-progress: false

env:
  BRANCH: scores/weekly

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check configuration
        id: config
        env:
          SCORES_SYNC_ENABLED: ${{ vars.SCORES_SYNC_ENABLED }}
          SCORES_SPREADSHEET_ID: ${{ vars.SCORES_SPREADSHEET_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SCORES_ROSTER_JSON: ${{ secrets.SCORES_ROSTER_JSON }}
        run: |
          ready=true
          if [ "$SCORES_SYNC_ENABLED" != "true" ]; then
            echo "Score sync is not enabled."
            ready=false
          fi
          for setting in SCORES_SPREADSHEET_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT SCORES_ROSTER_JSON; do
            if [ -z "${!setting}" ]; then
              echo "Missing Actions setting: $setting"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo "::notice::Score sync is inactive until the listed repository variables and secret are configured."
          fi

      - uses: actions/setup-python@v6
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v3
        if: steps.config.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install score importer dependencies
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -r pipeline/requirements.txt

      - name: Prepare private roster
        if: steps.config.outputs.ready == 'true'
        env:
          SCORES_ROSTER_JSON: ${{ secrets.SCORES_ROSTER_JSON }}
        run: |
          umask 077
          printf '%s' "$SCORES_ROSTER_JSON" > pipeline/roster.local.json

      - name: Read the score Sheet and build public data
        if: steps.config.outputs.ready == 'true'
        env:
          SCORES_SPREADSHEET_ID: ${{ vars.SCORES_SPREADSHEET_ID }}
        run: python pipeline/build_data.py --source sheets --spreadsheet-id "$SCORES_SPREADSHEET_ID"

      - name: Open or update the score review pull request
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if git diff --quiet -- data/semesters; then
            echo "The public score data matches the current site."
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "The private score Sheet now matches the published leaderboard."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/meta.json data/semesters
          git commit -m "scores: update public leaderboard"
          git push --force origin "$BRANCH"

          cat > "$RUNNER_TEMP/score-update.md" <<'EOF'
          Generated public leaderboard data from the private score Sheet.

          Review the proposed display names and results in **Files changed** before merging. Merging publishes the update through the existing GitHub Pages workflow.
          EOF

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/score-update.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Score update" \
              --body-file "$RUNNER_TEMP/score-update.md"
          fi
