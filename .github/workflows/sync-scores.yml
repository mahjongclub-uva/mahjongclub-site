name: Propose score update

on:
  schedule:
    # Friday 9:05pm Eastern, half an hour after scoring closes. GitHub cron is
    # UTC-only, so both candidates are scheduled: 01:05 UTC is 9:05pm in
    # daylight time and 02:05 UTC is 9:05pm in standard time. The first step
    # skips a run that starts outside 9pm-10pm Eastern, so it never needs
    # editing when the clocks change, and a slot GitHub starts up to an hour
    # late still runs. In daylight time both slots pass; the second finds
    # nothing new and exits.
    - cron: "5 1 * * 6"
    - cron: "5 2 * * 6"
  workflow_dispatch:

permissions:
  # Needed only to start the Checks workflow on the proposal branch.
  actions: write
  contents: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: score-update
  cancel-in-progress: false

env:
  BRANCH: scores/weekly
  FAILURE_TITLE: Score update is failing

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check configuration
        id: config
        env:
          SCORES_SYNC_ENABLED: ${{ vars.SCORES_SYNC_ENABLED }}
          SCORES_SPREADSHEET_ID: ${{ vars.SCORES_SPREADSHEET_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          ready=true
          # Scheduled runs go only from the 9pm Eastern slot; Run workflow
          # always goes.
          hour="$(TZ=America/New_York date +%H)"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$hour" != "21" ] && [ "$hour" != "22" ]; then
            echo "Not 9pm or 10pm in Eastern time; the other scheduled slot handles this week."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SCORES_SYNC_ENABLED" != "true" ]; then
            echo "Score sync is not enabled."
            ready=false
          fi
          for setting in SCORES_SPREADSHEET_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!setting}" ]; then
              echo "Missing Actions setting: $setting"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo "::notice::Score sync is inactive until the listed repository variables are configured."
          fi

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.config.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Tables still open when scoring closes are saved by the first request
      # to the meeting service after that, so ask once before reading.
      - name: Let the meeting service save any open tables
        if: steps.config.outputs.ready == 'true'
        run: |
          url="$(grep -oE 'https://script.google.com/macros/s/[A-Za-z0-9_-]+/exec' src/lib/site.ts | head -1)"
          if [ -n "$url" ]; then
            curl -fsSL --max-time 60 "$url?r=meeting" > /dev/null || echo "::warning::The meeting service did not answer; reading the Sheet as it is."
          fi

      - name: Install score importer dependencies
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -r pipeline/requirements.txt

      - name: Read the score Sheet and build public data
        if: steps.config.outputs.ready == 'true'
        env:
          SCORES_SPREADSHEET_ID: ${{ vars.SCORES_SPREADSHEET_ID }}
        run: |
          set -o pipefail
          python pipeline/build_data.py --source sheets --semester fall-2026 --spreadsheet-id "$SCORES_SPREADSHEET_ID" 2>&1 \
            | tee "$RUNNER_TEMP/score-update.log"

      # npm runs third-party code next, so the Google credential leaves the
      # disk first. Nothing after this step needs it.
      - name: Remove the Google credential
        if: always() && steps.config.outputs.ready == 'true'
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # The bot's pull request gets no checks of its own, so check the data here.
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Check the site builds with this data
        if: steps.config.outputs.ready == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Propose, check and merge the score update
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if git diff --quiet -- data/semesters; then
            echo "The public score data matches the current site."
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "The private score Sheet now matches the published leaderboard."
            fi
            exit 0
          fi

          # Checkout kept no credentials, so hand the token to git only here.
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/meta.json data/semesters
          git commit -m "scores: update public leaderboard"
          git push --force origin "$BRANCH"

          cat > "$RUNNER_TEMP/score-update.md" <<'EOF'
          ## Intent

          Update the public leaderboard from the private score Sheet.
          This pull request merges itself once the required checks pass.

          ## What Changed

          Regenerated the public semester results and metadata.

          ## Risk

          Merging publishes the proposed display names and results through GitHub Pages.
          The importer writes display names only and removes opted-out players; a wrong score in the Sheet is published as entered and corrected by the next sync.

          ## Test/Validation

          The score importer, Node tests, and production build passed before this proposal was created or updated.
          The required Checks workflow is also requested on this branch.
          EOF

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/score-update.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Score update" \
              --body-file "$RUNNER_TEMP/score-update.md"
          fi
          # Pull requests opened with GITHUB_TOKEN start no other workflows, so
          # the required Checks run is started by name on this branch.
          gh workflow run checks.yml --ref "$BRANCH"

          # Merge once that run passes on this exact commit. The data already
          # passed the importer, tests and build above; a failure here leaves
          # the pull request open and reports it in the failure issue.
          sha="$(git rev-parse HEAD)"
          run=""
          for _ in $(seq 1 30); do
            run="$(gh run list --workflow checks.yml --commit "$sha" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "The Checks run never started." >> "$RUNNER_TEMP/score-update.log"
            exit 1
          fi
          gh run watch "$run" --exit-status

          # GitHub holds the Checks run it starts for a bot's pull request until
          # someone approves it, and a held run blocks the merge even after the
          # required check has passed. Approve it and let it finish.
          for held in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$held/approve"
            gh run watch "$held" --exit-status
          done
          # The finished check can take a moment to count toward the merge rule.
          for attempt in 1 2 3; do
            gh pr merge "$BRANCH" --squash --delete-branch && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done

          # A merge made with this token does not start the deploy on its own.
          gh workflow run deploy.yml --ref main

      # Messages from build_data.py name tables and counts, never players.
      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The last score update failed, so the leaderboard is not being refreshed."
            echo
            echo '```'
            tail -n 20 "$RUNNER_TEMP/score-update.log" 2>/dev/null || echo "No log; see the run."
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/failure.md"
          issue="$(gh issue list --state open --search "\"$FAILURE_TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/failure.md"
          else
            gh issue create --title "$FAILURE_TITLE" --body-file "$RUNNER_TEMP/failure.md"
          fi

      - name: Close the failure issue once it works again
        if: success() && steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --search "\"$FAILURE_TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Working again as of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
